# Deployed copy: this file is the source for .github/workflows/fleet-sync.yml
# in the private shivanivermapro/fleet-ops repo (server-side sync layer).
# The per-fork rollout was rejected by design: a workflow commit on a fork's
# default branch permanently diverges it from upstream, breaking ff-only sync.
# One central repo loops all forks instead; forks stay pristine mirrors.
#
# Requires the FLEET_SYNC_TOKEN Actions secret: a fine-grained PAT with
# Contents read-write on shivanivermapro's repos (github.token only reaches the
# host repo). repos.txt in fleet-ops mirrors the manifest's sync: true list.
name: fleet-sync
on:
  schedule:
    - cron: "0 14 * * *"   # daily 14:00 UTC
  workflow_dispatch: {}
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fast-forward every fork's default branch from upstream
        env:
          GH_TOKEN: ${{ secrets.FLEET_SYNC_TOKEN }}
        run: |
          set -u
          fail=0
          while IFS= read -r repo; do
            [ -z "$repo" ] && continue
            case "$repo" in \#*) continue ;; esac
            out=$(gh repo sync "shivanivermapro/$repo" 2>&1)
            status=$?
            if [ $status -eq 0 ]; then
              echo "ok        $repo: $out"
            elif echo "$out" | grep -qi "diverg"; then
              echo "diverged  $repo (left untouched)"
            else
              echo "FAILED    $repo: $out"
              fail=1
            fi
          done < repos.txt
          exit $fail
